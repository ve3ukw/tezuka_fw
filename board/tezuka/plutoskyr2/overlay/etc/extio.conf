# PlutoSky R2 JP5 header (EXT_IO) hardware, read by /usr/bin/extio.
# Plain shell assignments.
#
# The header lines go straight to FPGA pins (no buffering or protection) and
# reach Linux as EMIO GPIO lines of the zynq_gpio chip, offset
# EXTIO_EMIO_BASE + EMIO bit (see maia-hdl plutoskyr2 system_top.v).
# Pin 1 is 5 V, pins 2/22/24 are GND, pin 23 is the 40 MHz clock select
# (CLK_SEL: pulled up by R137 = onboard VCTCXO, low = external 40 MHz input).
#
# Pin 21 (EXT_IO0) is the only 3.3 V line and the one that can drive CLK_SEL:
# with a jumper from pin 21 to pin 23 (vendor manual, Fig. 2), set
# extio_pin21=out,clk_sel,1 (1 = onboard VCTCXO, 0 = external 40 MHz). Without
# that jumper, leave pin 21 off unless you need a 3.3 V line.
EXTIO_CHIP_LABEL=zynq_gpio
EXTIO_EMIO_BASE=54

# <header pin>:<EMIO bit>:<volts>
EXTIO_PINS="03:18:1.8 04:20:1.8 05:19:1.8 06:21:1.8 07:22:1.8 08:24:1.8 09:23:1.8 10:25:1.8 11:26:1.8 12:28:1.8 13:27:1.8 14:29:1.8 15:30:1.8 16:56:1.8 17:55:1.8 18:57:1.8 19:58:1.8 20:59:1.8 21:17:3.3"

# Used while extio_pinNN is not set in the u-boot environment; other pins
# default to off. The bitstream pulls every 1.8 V line down, so outputs stay
# off until Linux drives them; pin 21 has no pull (see above).
EXTIO_DEFAULT_pin03="out,ptt,0"
EXTIO_DEFAULT_pin04="out,lna_en,0"
